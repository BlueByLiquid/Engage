name: Build episode cast index
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_cast.py'
      - '.github/workflows/cast.yml'
permissions:
  contents: write
jobs:
  cast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch episode-specific cast credits
        run: python scripts/build_cast.py
      - name: Commit cast index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cast.json
          if ! git diff --cached --quiet; then
            git commit -m "Build complete TNG guest cast index"
            git push
          fi
